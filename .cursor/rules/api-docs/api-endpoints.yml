---
openapi: 3.1.0
components:
  schemas:
    AuthCreateDTO:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          pattern: \S
        password:
          type: string
          pattern: \S
    AuthDTO:
      type: object
      properties:
        accessToken:
          type: string
    AuthExtDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        type:
          $ref: "#/components/schemas/UserTypeEnum"
        createdAt:
          $ref: "#/components/schemas/Instant"
        isAccountActive:
          type: boolean
    BenefitCreateDTO:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          pattern: \S
        description:
          type: string
        address:
          type: string
        sponsorId:
          type: integer
          format: int64
    BenefitDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        address:
          type: string
        isActive:
          type: boolean
        sponsor:
          $ref: "#/components/schemas/SponsorMinDTO"
        createdAt:
          $ref: "#/components/schemas/Instant"
        active:
          type: boolean
    BenefitUpdateDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        address:
          type: string
        sponsorId:
          type: integer
          format: int64
    EnvelopeAuthDTO:
      type: object
      description: Resposta padrão da API com dados de autenticação (token JWT)
      properties:
        status:
          type: string
          enum:
          - OK
          - ERROR
          description: OK em sucesso ou ERROR em falha
        statusCode:
          type: integer
          format: int32
          description: Código HTTP da operação
        message:
          type: string
          description: Mensagem única de erro (quando aplicável)
        messages:
          type: array
          items:
            type: string
          description: Lista de mensagens de erro ou validação (quando aplicável)
        data:
          $ref: "#/components/schemas/AuthDTO"
          type: object
          description: Payload em sucesso; em erro costuma ser omitido ou null
        totalElements:
          type: integer
          format: int64
          description: Total de elementos (listagens paginadas)
        totalPages:
          type: integer
          format: int32
          description: Total de páginas (listagens paginadas)
        pageSize:
          type: integer
          format: int32
          description: Tamanho da página (listagens paginadas)
        currentPage:
          type: integer
          format: int32
          description: "Página atual, 1-based (listagens paginadas)"
        stackTrace:
          type: array
          items:
            type: string
          description: Stack trace em ambiente de desenvolvimento (erros)
