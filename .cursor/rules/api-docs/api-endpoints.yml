          pattern: \S
        document:
          type: string
          pattern: \S
        code:
          type: string
          pattern: \S
    UserMinDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/UserTypeEnum"
        createdAt:
          $ref: "#/components/schemas/Instant"
    UserTypeEnum:
      type: string
      enum:
      - ADM
      - SPONSOR
      - MEMBER
      - SPONSOR_MEMBER
    UserWithSponsorCreateDTO:
      type: object
      required:
      - user
      properties:
        user:
          $ref: "#/components/schemas/UserCreateDTO"
        sponsor:
          $ref: "#/components/schemas/SponsorDataCreateDTO"
    UserWithSponsorDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        document:
          type: string
        code:
          type: string
        isAccountActive:
          type: boolean
        type:
          $ref: "#/components/schemas/UserTypeEnum"
        avatarUrl:
          type: string
        createdAt:
          $ref: "#/components/schemas/Instant"
        sponsor:
          $ref: "#/components/schemas/SponsorDTO"
        accountActive:
          type: boolean
    UserWithSponsorUpdateDTO:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        document:
          type: string
        avatarUrl:
          type: string
        sponsor:
          $ref: "#/components/schemas/SponsorDataUpdateDTO"
  securitySchemes:
    bearerAuth:
      description: JWT Bearer Token
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Admin - Benefícios
- name: Admin - Uploads
- name: Admin - Usuários
- name: Auth
  description: Autenticação e dados do usuário logado
- name: Público
  description: Endpoints sem autenticação JWT
paths:
  /v1/admin/benefit:
    get:
      summary: Listar benefícios
      description: Listagem paginada com filtros por patrocinador e status de ativação.
      tags:
      - Admin - Benefícios
      parameters:
      - description: Filtrar por benefício ativo/inativo
        name: isActive
        in: query
        schema:
          type: boolean
      - description: Número da página (0-based)
        name: page
        in: query
        schema:
          type: integer
          format: int32
      - description: Itens por página
        name: size
        in: query
        schema:
          type: integer
          format: int32
      - description: ID do patrocinador
        name: sponsorId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Lista paginada de benefícios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBenefitListDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
    post:
      summary: Criar benefício
      description: "Cria um benefício geral ou vinculado a um patrocinador. Se sponsorId\
        \ informado, valida existência."
      tags:
      - Admin - Benefícios
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenefitCreateDTO"
        required: true
      responses:
        "201":
          description: Benefício criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBenefitDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
  /v1/admin/benefit/{id}:
    put:
      summary: Atualizar benefício
      description: Atualização parcial. Permite vincular/desvincular patrocinador
        via sponsorId.
      tags:
      - Admin - Benefícios
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenefitUpdateDTO"
        required: true
      responses:
        "200":
          description: Benefício atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBenefitDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
    get:
      summary: Buscar benefício por ID
      description: Retorna o benefício com dados mínimos do patrocinador quando vinculado.
      tags:
      - Admin - Benefícios
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Benefício encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBenefitDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
    delete:
      summary: Excluir benefício
      description: Exclusão física e irreversível do benefício.
      tags:
      - Admin - Benefícios
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Benefício excluído
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVoid"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
  /v1/admin/benefit/{id}/deactivate:
    patch:
      summary: Desativar benefício
      description: Desativação lógica (soft delete). Define isActive como false.
      tags:
      - Admin - Benefícios
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Benefício desativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVoid"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
  /v1/admin/uploads:
    delete:
      summary: Remover imagem
      description: Remove o objeto no R2 e limpa avatar_url ou logo_url quando a chave
        coincide com a atual.
      tags:
      - Admin - Uploads
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDeleteDTO"
        required: true
      responses:
        "200":
          description: Sucesso (idempotente se já não houver imagem)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUploadDeleteDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
  /v1/admin/uploads/confirm:
    post:
      summary: Confirmar upload
      description: Valida o objeto no bucket e persiste avatar_url ou logo_url (path
        relativo).
      tags:
      - Admin - Uploads
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadConfirmDTO"
        required: true
      responses:
        "200":
          description: Vínculo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUploadConfirmDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
  /v1/admin/uploads/init:
    post:
      summary: Iniciar upload
      description: "Retorna URL assinada (PUT) para envio direto ao R2. entity: user\
        \ (avatar) ou sponsor (logo); entityId: id do User ou do Sponsor."
      tags:
      - Admin - Uploads
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInitDTO"
        required: true
      responses:
        "200":
          description: URL gerada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUploadInitDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
  /v1/admin/user:
    get:
      summary: Listar usuários
      description: "Listagem paginada com filtros por tipo, tier e status de ativaç\
        ão."
      tags:
      - Admin - Usuários
      parameters:
      - description: Filtrar por conta ativa/inativa
        name: isActive
        in: query
        schema:
          type: boolean
      - description: Número da página (0-based)
        name: page
        in: query
        schema:
          type: integer
          format: int32
      - description: Itens por página
        name: size
        in: query
        schema:
          type: integer
          format: int32
      - description: Tier do patrocinador
        schema:
          enum:
          - BRONZE
          - SILVER
          - GOLD
        name: tier
        in: query
      - description: Tipo do usuário
        name: type
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Lista paginada de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUserWithSponsorListDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
    post:
      summary: Criar usuário
      description: Cria um novo usuário com dados opcionais de patrocinador. Tipo
        MEMBER e SPONSOR_MEMBER ainda não implementados.
      tags:
      - Admin - Usuários
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWithSponsorCreateDTO"
        required: true
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUserWithSponsorDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
  /v1/admin/user/{id}:
    put:
      summary: Atualizar usuário
      description: "Atualização parcial do usuário e do patrocinador vinculado, quando\
        \ aplicável."
      tags:
      - Admin - Usuários
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWithSponsorUpdateDTO"
        required: true
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUserWithSponsorDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
    get:
      summary: Buscar usuário por ID
      description: Retorna o usuário com dados de patrocinador embutidos quando aplicável.
      tags:
      - Admin - Usuários
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUserWithSponsorDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
    delete:
      summary: Excluir usuário
      description: Exclusão física e irreversível. Remove em cascata sponsor e benefícios
        vinculados.
      tags:
      - Admin - Usuários
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Usuário excluído
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVoid"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
  /v1/admin/user/{id}/activate:
    patch:
      summary: Ativar usuário
      description: "Reativa a conta (`isAccountActive = true`). Se o tipo for SPONSOR\
        \ ou SPONSOR_MEMBER, reativa o registro de patrocinador e os benefícios vinculados\
        \ a esse patrocinador."
      tags:
      - Admin - Usuários
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Usuário ativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVoid"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
  /v1/admin/user/{id}/deactivate:
    patch:
      summary: Desativar usuário
      description: "Desativação lógica. Se SPONSOR, desativa também o patrocinador\
        \ e seus benefícios."
      tags:
      - Admin - Usuários
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Usuário desativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVoid"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth:
        - ADM
  /v1/auth:
    post:
      summary: Login
      description: Autentica o usuário e retorna um token JWT
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCreateDTO"
        required: true
      responses:
        "200":
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthDTO"
  /v1/auth/me:
    get:
      summary: Dados do usuário logado
      description: Retorna os dados do usuário autenticado via token JWT
      tags:
      - Auth
      responses:
        "200":
          description: Dados do usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthExtDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /v1/public/sponsors:
    get:
      summary: Listar patrocinadores ativos (público)
      description: "Listagem paginada de usuários tipo SPONSOR com conta ativa, patrocinador\
        \ ativo e filtro opcional por tier. Sem dados sensíveis do usuário; apenas\
        \ campos públicos acordados."
      tags:
      - Público
      parameters:
      - description: Número da página (1-based)
        name: page
        in: query
        schema:
          type: integer
          format: int32
      - description: Itens por página
        name: size
        in: query
        schema:
          type: integer
          format: int32
      - description: Tier do patrocinador
        schema:
          enum:
          - BRONZE
          - SILVER
          - GOLD
        name: tier
        in: query
      responses:
        "200":
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicSponsorListDTO"
        "400":
          description: Validação de query params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeErrorDTO"
info:
  title: Jet Backoffice API
  version: 1.1.0
  description: API do backoffice da Associação Desportiva Artística e Cultural Joyce
    e Teatino