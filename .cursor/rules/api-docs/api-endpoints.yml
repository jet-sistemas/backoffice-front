---
openapi: 3.1.0
components:
  schemas:
    AuthCreateDTO:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          pattern: \S
        password:
          type: string
          pattern: \S
    AuthDTO:
      type: object
      properties:
        accessToken:
          type: string
    AuthExtDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        type:
          $ref: "#/components/schemas/UserTypeEnum"
        createdAt:
          $ref: "#/components/schemas/Instant"
        isAccountActive:
          type: boolean
    BenefitCreateDTO:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          pattern: \S
        description:
          type: string
        address:
          type: string
        sponsorId:
          type: integer
          format: int64
    BenefitDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        address:
          type: string
        isActive:
          type: boolean
        sponsor:
          $ref: "#/components/schemas/SponsorMinDTO"
        createdAt:
          $ref: "#/components/schemas/Instant"
        active:
          type: boolean
    BenefitUpdateDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        address:
          type: string
        sponsorId:
          type: integer
          format: int64
    EnvelopeAuthDTO:
      type: object
      description: Resposta padrão da API com dados de autenticação (token JWT)
      properties:
        status:
          type: string
          enum:
            - OK
            - ERROR
          description: OK em sucesso ou ERROR em falha
        statusCode:
          type: integer
          format: int32
          description: Código HTTP da operação
        message:
          type: string
          description: Mensagem única de erro (quando aplicável)
        messages:
          type: array
          items:
            type: string
          description: Lista de mensagens de erro ou validação (quando aplicável)
        data:
          $ref: "#/components/schemas/AuthDTO"
          type: object
          description: Payload em sucesso; em erro costuma ser omitido ou null
        totalElements:
          type: integer
          format: int64
          description: Total de elementos (listagens paginadas)
        totalPages:
          type: integer
          format: int32
          description: Total de páginas (listagens paginadas)
        pageSize:
          type: integer
          format: int32
          description: Tamanho da página (listagens paginadas)
        currentPage:
          type: integer
          format: int32
          description: "Página atual, 1-based (listagens paginadas)"
        stackTrace:
          type: array
          items:
            type: string
          description: Stack trace em ambiente de desenvolvimento (erros)
    EnvelopeAuthExtDTO:
      type: object
      description: Resposta padrão da API com dados estendidos do usuário autenticado
      properties:
        status:
          type: string
          enum:
            - OK
            - ERROR
          description: OK em sucesso ou ERROR em falha
        statusCode:
          type: integer
          format: int32
          description: Código HTTP da operação
        message:
          type: string
          description: Mensagem única de erro (quando aplicável)
        messages:
          type: array
          items:
            type: string
          description: Lista de mensagens de erro ou validação (quando aplicável)
        data:
          $ref: "#/components/schemas/AuthExtDTO"
          type: object
          description: Payload em sucesso; em erro costuma ser omitido ou null
        totalElements:
          type: integer
          format: int64
          description: Total de elementos (listagens paginadas)
        totalPages:
          type: integer
          format: int32
          description: Total de páginas (listagens paginadas)
        pageSize:
          type: integer
          format: int32
          description: Tamanho da página (listagens paginadas)
        currentPage:
          type: integer
          format: int32
          description: "Página atual, 1-based (listagens paginadas)"
        stackTrace:
          type: array
          items:
            type: string
          description: Stack trace em ambiente de desenvolvimento (erros)
    EnvelopeBenefitDTO:
      type: object
      description: Resposta padrão da API com um benefício
      properties:
        status:
          type: string
          enum:
            - OK
            - ERROR
          description: OK em sucesso ou ERROR em falha
        statusCode:
          type: integer
          format: int32
          description: Código HTTP da operação
        message:
          type: string
          description: Mensagem única de erro (quando aplicável)
        messages:
          type: array
          items:
            type: string
          description: Lista de mensagens de erro ou validação (quando aplicável)
        data:
          $ref: "#/components/schemas/BenefitDTO"
          type: object
          description: Payload em sucesso; em erro costuma ser omitido ou null
        totalElements:
          type: integer
          format: int64
          description: Total de elementos (listagens paginadas)
        totalPages:
          type: integer
          format: int32
          description: Total de páginas (listagens paginadas)
        pageSize:
          type: integer
          format: int32
          description: Tamanho da página (listagens paginadas)
        currentPage:
          type: integer
          format: int32
          description: "Página atual, 1-based (listagens paginadas)"
        stackTrace:
          type: array
          items:
            type: string
          description: Stack trace em ambiente de desenvolvimento (erros)
    EnvelopeBenefitListDTO:
      type: object
      description:
        "Resposta paginada: data é a lista de benefícios; totalElements,\
        \ totalPages, pageSize e currentPage quando aplicável"
      properties:
        status:
          type: string
          enum:
            - OK
            - ERROR
          description: OK em sucesso ou ERROR em falha
        statusCode:
          type: integer
          format: int32
          description: Código HTTP da operação
        message:
          type: string
          description: Mensagem única de erro (quando aplicável)
        messages:
          type: array
          items:
            type: string
          description: Lista de mensagens de erro ou validação (quando aplicável)
        data:
          type: array
          items:
            $ref: "#/components/schemas/BenefitDTO"
          description: Payload em sucesso; em erro costuma ser omitido ou null
        totalElements:
          type: integer
          format: int64
          description: Total de elementos (listagens paginadas)
        totalPages:
          type: integer
          format: int32
          description: Total de páginas (listagens paginadas)
        pageSize:
          type: integer
          format: int32
          description: Tamanho da página (listagens paginadas)
        currentPage:
          type: integer
          format: int32
          description: "Página atual, 1-based (listagens paginadas)"
        stackTrace:
          type: array
          items:
            type: string
          description: Stack trace em ambiente de desenvolvimento (erros)
    EnvelopeErrorDTO:
      type: object
      description:
        "Envelope de erro retornado pelo GlobalExceptionMapper. `status`\
        \ = ERROR e `statusCode` espelha o HTTP. Em 400 por Bean Validation, prefira\
        \ `messages`; nos demais casos, `message`. Em 500, `stackTrace` pode aparecer\
        \ em desenvolvimento."
      properties:
        status:
          type: string
          enum:
            - OK
            - ERROR
          description: OK em sucesso ou ERROR em falha
        statusCode:
          type: integer
          format: int32
          description: Código HTTP da operação
        message:
          type: string
          description: Mensagem única de erro (quando aplicável)
        messages:
          type: array
          items:
            type: string
          description: Lista de mensagens de erro ou validação (quando aplicável)
        data:
          description: Payload em sucesso; em erro costuma ser omitido ou null
        totalElements:
          type: integer
          format: int64
          description: Total de elementos (listagens paginadas)
        totalPages:
          type: integer
          format: int32
          description: Total de páginas (listagens paginadas)
        pageSize:
          type: integer
          format: int32
          description: Tamanho da página (listagens paginadas)
        currentPage:
          type: integer
          format: int32
          description: "Página atual, 1-based (listagens paginadas)"
        stackTrace:
          type: array
          items:
            type: string
          description: Stack trace em ambiente de desenvolvimento (erros)
    EnvelopeUserWithSponsorDTO:
      type: object
      description: Resposta padrão da API com um usuário (e patrocinador quando aplicável)
      properties:
        status:
          type: string
          enum:
            - OK
            - ERROR
          description: OK em sucesso ou ERROR em falha
        statusCode:
          type: integer
          format: int32
          description: Código HTTP da operação
        message:
          type: string
          description: Mensagem única de erro (quando aplicável)
        messages:
          type: array
          items:
            type: string
          description: Lista de mensagens de erro ou validação (quando aplicável)
        data:
          $ref: "#/components/schemas/UserWithSponsorDTO"
          type: object
          description: Payload em sucesso; em erro costuma ser omitido ou null
        totalElements:
          type: integer
          format: int64
          description: Total de elementos (listagens paginadas)
        totalPages:
          type: integer
          format: int32
          description: Total de páginas (listagens paginadas)
        pageSize:
          type: integer
          format: int32
          description: Tamanho da página (listagens paginadas)
        currentPage:
          type: integer
          format: int32
          description: "Página atual, 1-based (listagens paginadas)"
        stackTrace:
          type: array
          items:
            type: string
          description: Stack trace em ambiente de desenvolvimento (erros)
    EnvelopeUserWithSponsorListDTO:
      type: object
      description:
        "Resposta paginada: data é a lista de usuários; totalElements,\
        \ totalPages, pageSize e currentPage quando aplicável"
      properties:
        status:
          type: string
          enum:
            - OK
            - ERROR
          description: OK em sucesso ou ERROR em falha
        statusCode:
          type: integer
          format: int32
          description: Código HTTP da operação
        message:
          type: string
          description: Mensagem única de erro (quando aplicável)
        messages:
          type: array
          items:
            type: string
          description: Lista de mensagens de erro ou validação (quando aplicável)
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserWithSponsorDTO"
          description: Payload em sucesso; em erro costuma ser omitido ou null
        totalElements:
          type: integer
          format: int64
          description: Total de elementos (listagens paginadas)
        totalPages:
          type: integer
          format: int32
          description: Total de páginas (listagens paginadas)
        pageSize:
          type: integer
          format: int32
          description: Tamanho da página (listagens paginadas)
        currentPage:
          type: integer
          format: int32
          description: "Página atual, 1-based (listagens paginadas)"
        stackTrace:
          type: array
          items:
            type: string
          description: Stack trace em ambiente de desenvolvimento (erros)
    EnvelopeVoid:
      type: object
      description: Resposta padrão da API sem payload em data (pode ser null)
      properties:
        status:
          type: string
          enum:
            - OK
            - ERROR
          description: OK em sucesso ou ERROR em falha
        statusCode:
          type: integer
          format: int32
          description: Código HTTP da operação
        message:
          type: string
          description: Mensagem única de erro (quando aplicável)
        messages:
          type: array
          items:
            type: string
          description: Lista de mensagens de erro ou validação (quando aplicável)
        data:
          description: Payload em sucesso; em erro costuma ser omitido ou null
        totalElements:
          type: integer
          format: int64
          description: Total de elementos (listagens paginadas)
        totalPages:
          type: integer
          format: int32
          description: Total de páginas (listagens paginadas)
        pageSize:
          type: integer
          format: int32
          description: Tamanho da página (listagens paginadas)
        currentPage:
          type: integer
          format: int32
          description: "Página atual, 1-based (listagens paginadas)"
        stackTrace:
          type: array
          items:
            type: string
          description: Stack trace em ambiente de desenvolvimento (erros)
    Instant:
      type: string
      format: date-time
      examples:
        - 2022-03-10T16:15:50Z
    ResponseModel:
      type: object
      description: Envelope padrão de todas as respostas HTTP
      properties:
        status:
          type: string
          enum:
            - OK
            - ERROR
          description: OK em sucesso ou ERROR em falha
        statusCode:
          type: integer
          format: int32
          description: Código HTTP da operação
        message:
          type: string
          description: Mensagem única de erro (quando aplicável)
        messages:
          type: array
          items:
            type: string
          description: Lista de mensagens de erro ou validação (quando aplicável)
        data:
          description: Payload em sucesso; em erro costuma ser omitido ou null
        totalElements:
          type: integer
          format: int64
          description: Total de elementos (listagens paginadas)
        totalPages:
          type: integer
          format: int32
          description: Total de páginas (listagens paginadas)
        pageSize:
          type: integer
          format: int32
          description: Tamanho da página (listagens paginadas)
        currentPage:
          type: integer
          format: int32
          description: "Página atual, 1-based (listagens paginadas)"
        stackTrace:
          type: array
          items:
            type: string
          description: Stack trace em ambiente de desenvolvimento (erros)
    SponsorDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/UserMinDTO"
        publicName:
          type: string
        tier:
          $ref: "#/components/schemas/SponsorTierEnum"
        entityType:
          $ref: "#/components/schemas/SponsorEntityTypeEnum"
        persona:
          $ref: "#/components/schemas/SponsorPersonaEnum"
        logoUrl:
          type: string
        site:
          type: string
        instagram:
          type: string
        whatsapp:
          type: string
        isActive:
          type: boolean
        lastActiveSponsorship:
          $ref: "#/components/schemas/Instant"
        createdAt:
          $ref: "#/components/schemas/Instant"
        active:
          type: boolean
    SponsorDataCreateDTO:
      type: object
      required:
        - publicName
        - tier
        - entityType
      properties:
        publicName:
          type: string
          pattern: \S
        tier:
          type: string
          pattern: \S
        entityType:
          type: string
          pattern: \S
        persona:
          type: string
        logoUrl:
          type: string
        site:
          type: string
        instagram:
          type: string
        whatsapp:
          type: string
    SponsorDataUpdateDTO:
      type: object
      properties:
        publicName:
          type: string
        tier:
          type: string
        entityType:
          type: string
        persona:
          type: string
        logoUrl:
          type: string
        site:
          type: string
        instagram:
          type: string
        whatsapp:
          type: string
        isActive:
          type: boolean
    SponsorEntityTypeEnum:
      type: string
      enum:
        - PERSON
        - COMPANY
        - GOVERNMENT
        - NGO
    SponsorMinDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        publicName:
          type: string
        tier:
          $ref: "#/components/schemas/SponsorTierEnum"
        isActive:
          type: boolean
        active:
          type: boolean
    SponsorPersonaEnum:
      type: string
      enum:
        - POLITICIAN
        - INFLUENCER
        - ATHLETE
        - OTHER
    SponsorTierEnum:
      type: string
      enum:
        - BRONZE
        - SILVER
        - GOLD
    UserCreateDTO:
      type: object
      required:
        - email
        - name
        - document
        - code
      properties:
        email:
          type: string
          pattern: \S
        password:
          type: string
        avatarUrl:
          type: string
        type:
          type: string
        name:
          type: string
          pattern: \S
        document:
          type: string
          pattern: \S
        code:
          type: string
          pattern: \S
    UserMinDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/UserTypeEnum"
        createdAt:
          $ref: "#/components/schemas/Instant"
    UserTypeEnum:
      type: string
      enum:
        - ADM
        - SPONSOR
        - MEMBER
        - SPONSOR_MEMBER
    UserWithSponsorCreateDTO:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/UserCreateDTO"
        sponsor:
          $ref: "#/components/schemas/SponsorDataCreateDTO"
    UserWithSponsorDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        document:
          type: string
        code:
          type: string
        isAccountActive:
          type: boolean
        type:
          $ref: "#/components/schemas/UserTypeEnum"
        avatarUrl:
          type: string
        createdAt:
          $ref: "#/components/schemas/Instant"
        sponsor:
          $ref: "#/components/schemas/SponsorDTO"
        accountActive:
          type: boolean
    UserWithSponsorUpdateDTO:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        document:
          type: string
        avatarUrl:
          type: string
        sponsor:
          $ref: "#/components/schemas/SponsorDataUpdateDTO"
  securitySchemes:
    bearerAuth:
      description: JWT Bearer Token
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Admin - Benefícios
  - name: Admin - Usuários
  - name: Auth
    description: Autenticação e dados do usuário logado
paths:
  /v1/admin/benefit:
    get:
      summary: Listar benefícios
      description: Listagem paginada com filtros por patrocinador e status de ativação.
      tags:
        - Admin - Benefícios
      parameters:
        - description: Filtrar por benefício ativo/inativo
          name: isActive
          in: query
          schema:
            type: boolean
        - description: Número da página (0-based)
          name: page
          in: query
          schema:
            type: integer
            format: int32
        - description: Itens por página
          name: size
          in: query
          schema:
            type: integer
            format: int32
        - description: ID do patrocinador
          name: sponsorId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Lista paginada de benefícios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBenefitListDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
        - bearerAuth:
            - ADM
    post:
      summary: Criar benefício
      description:
        "Cria um benefício geral ou vinculado a um patrocinador. Se sponsorId\
        \ informado, valida existência."
      tags:
        - Admin - Benefícios
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenefitCreateDTO"
        required: true
      responses:
        "201":
          description: Benefício criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBenefitDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
        - bearerAuth:
            - ADM
  /v1/admin/benefit/{id}:
    put:
      summary: Atualizar benefício
      description:
        Atualização parcial. Permite vincular/desvincular patrocinador
        via sponsorId.
      tags:
        - Admin - Benefícios
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenefitUpdateDTO"
        required: true
      responses:
        "200":
          description: Benefício atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBenefitDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
        - bearerAuth:
            - ADM
    get:
      summary: Buscar benefício por ID
      description: Retorna o benefício com dados mínimos do patrocinador quando vinculado.
      tags:
        - Admin - Benefícios
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Benefício encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBenefitDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
        - bearerAuth:
            - ADM
    delete:
      summary: Excluir benefício
      description: Exclusão física e irreversível do benefício.
      tags:
        - Admin - Benefícios
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Benefício excluído
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVoid"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
        - bearerAuth:
            - ADM
  /v1/admin/benefit/{id}/deactivate:
    patch:
      summary: Desativar benefício
      description: Desativação lógica (soft delete). Define isActive como false.
      tags:
        - Admin - Benefícios
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Benefício desativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVoid"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
        - bearerAuth:
            - ADM
  /v1/admin/user:
    get:
      summary: Listar usuários
      description:
        "Listagem paginada com filtros por tipo, tier e status de ativaç\
        ão."
      tags:
        - Admin - Usuários
      parameters:
        - description: Filtrar por conta ativa/inativa
          name: isActive
          in: query
          schema:
            type: boolean
        - description: Número da página (0-based)
          name: page
          in: query
          schema:
            type: integer
            format: int32
        - description: Itens por página
          name: size
          in: query
          schema:
            type: integer
            format: int32
        - description: Tier do patrocinador
          name: tier
          in: query
          schema:
            $ref: "#/components/schemas/SponsorTierEnum"
        - description: Tipo do usuário
          name: type
          in: query
          schema:
            $ref: "#/components/schemas/UserTypeEnum"
      responses:
        "200":
          description: Lista paginada de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUserWithSponsorListDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
        - bearerAuth:
            - ADM
    post:
      summary: Criar usuário
      description:
        Cria um novo usuário com dados opcionais de patrocinador. Tipo
        MEMBER e SPONSOR_MEMBER ainda não implementados.
      tags:
        - Admin - Usuários
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWithSponsorCreateDTO"
