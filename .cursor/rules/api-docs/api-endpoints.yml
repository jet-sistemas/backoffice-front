    EnvelopeErrorDTO:
      type: object
      description: "Envelope de erro padronizado (`ResponseModel`). `status` = ERROR\
        \ e `statusCode` espelha o HTTP. Em 400 por Bean Validation na borda REST,\
        \ `RestValidationExceptionMapper` preenche `messages`; demais erros passam\
